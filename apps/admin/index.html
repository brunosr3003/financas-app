<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cofre — Painel de assinaturas</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:#fcfcfb; --page:#f9f9f7; --ink-1:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --accent:#2a78d6; --good:#0ca30c; --good-text:#006300; --critical:#d03b3b; --radius:12px;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme:dark; --surface-1:#1a1a19; --page:#0d0d0d; --ink-1:#fff; --ink-2:#c3c2b7;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10); --accent:#3987e5; --good-text:#0ca30c; }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--page); color:var(--ink-1); min-height:100dvh; }
  main { max-width:760px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { font-size:13px; color:var(--ink-muted); margin-bottom:18px; }
  .card { background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; }
  .field label { display:block; font-size:12.5px; color:var(--ink-2); margin-bottom:4px; }
  .field input { width:100%; padding:10px 12px; border:1px solid var(--baseline); border-radius:8px; background:var(--page); font-size:15px; color:var(--ink-1); }
  .btn { padding:10px 16px; border-radius:8px; border:none; background:var(--accent); color:#fff; font-weight:600; font-size:14px; cursor:pointer; margin-top:10px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--grid); }
  .row:last-child { border-bottom:none; }
  .row .n { font-size:14px; font-weight:600; }
  .row .d { font-size:11.5px; color:var(--ink-muted); margin-top:2px; }
  .badge { font-size:10.5px; font-weight:700; border-radius:99px; padding:3px 9px; }
  .badge.on { background:#d9f2d9; color:var(--good-text); }
  .badge.off { background:var(--grid); color:var(--ink-2); }
  .switch { position:relative; width:44px; height:26px; flex:none; cursor:pointer; }
  .switch input { opacity:0; width:0; height:0; }
  .switch .sl { position:absolute; inset:0; background:var(--baseline); border-radius:99px; transition:.15s; }
  .switch .sl:before { content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
  .switch input:checked + .sl { background:var(--good); }
  .switch input:checked + .sl:before { transform:translateX(18px); }
  .erro { color:var(--critical); font-size:13px; margin-top:8px; }
  .muted { color:var(--ink-muted); font-size:13px; text-align:center; padding:20px; }
</style>
</head>
<body>
<main>
  <h1>Painel de assinaturas — Cofre</h1>
  <div class="sub">Ativa e desativa o acesso das contas. Empresa inativa vê a tela de "aguardando ativação".</div>

  <div class="card" id="loginCard">
    <div class="field"><label>Chave de administração</label><input id="chave" type="password" placeholder="x-admin-key"></div>
    <button class="btn" onclick="entrar()">Entrar</button>
    <div class="erro" id="loginErro"></div>
  </div>

  <div class="card" id="lista" style="display:none"></div>
</main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const fmtData = (s) => s ? new Date(s).toLocaleDateString('pt-BR') : '—';
let CHAVE = localStorage.getItem('cofre_admin_key') || '';

async function apiAdmin(metodo, rota, corpo) {
  const res = await fetch('/api' + rota, {
    method: metodo,
    headers: { 'content-type': 'application/json', 'x-admin-key': CHAVE },
    body: corpo ? JSON.stringify(corpo) : undefined,
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || 'Erro ' + res.status);
  return res.json();
}

async function carregar() {
  const empresas = await apiAdmin('GET', '/admin/empresas');
  $('loginCard').style.display = 'none';
  const lista = $('lista');
  lista.style.display = 'block';
  if (empresas.length === 0) { lista.innerHTML = '<div class="muted">Nenhuma conta ainda.</div>'; return; }
  lista.innerHTML = empresas.map((e) => `
    <div class="row">
      <div style="min-width:0">
        <div class="n">${e.nome} <span class="badge ${e.assinaturaAtiva ? 'on' : 'off'}">${e.assinaturaAtiva ? 'ativa' : 'inativa'}</span></div>
        <div class="d">${e.dono || 'sem dono'} · criada ${fmtData(e.criadaEm)} · ${e.membros} membro(s) · ${e.transacoes} lançamento(s)${e.assinaturaAtiva ? ' · ativa desde ' + fmtData(e.assinaturaEm) : ''}</div>
      </div>
      <label class="switch"><input type="checkbox" ${e.assinaturaAtiva ? 'checked' : ''} onchange="alternar('${e.id}', this.checked)"><span class="sl"></span></label>
    </div>`).join('');
}

async function alternar(id, ativa) {
  try { await apiAdmin('POST', '/admin/empresas/' + id + '/assinatura', { ativa }); await carregar(); }
  catch (err) { alert(err.message); await carregar(); }
}

async function entrar() {
  CHAVE = $('chave').value.trim();
  $('loginErro').textContent = '';
  try {
    await carregar();
    localStorage.setItem('cofre_admin_key', CHAVE);
  } catch (err) { $('loginErro').textContent = err.message; }
}

if (CHAVE) carregar().catch(() => { localStorage.removeItem('cofre_admin_key'); });
</script>
</body>
</html>
