services:
  db:
    image: postgres:16-alpine
    container_name: financas-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financas
    ports:
      - "5434:5432"
    volumes:
      - financas_pgdata:/var/lib/postgresql/data

volumes:
  financas_pgdata:
